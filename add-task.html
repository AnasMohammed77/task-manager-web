<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مهمة | نظام المهام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> نظام إدارة المهام</h1>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="add-task.html">إضافة مهمة</a>
            <a href="tasks.html">المهام</a>
            <a href="edit-task.html">تعديل</a>
            <a href="statistics.html">إحصائيات</a>
        </nav>
    </header>

    <main>
        <h2 class="add_addrass"> إضافة مهمة جديدة</h2>
        
        <form id="taskForm" class="form-box">
            <label>عنوان المهمة:</label>
            <input type="text" id="title" required placeholder="اكتب عنوان المهمة">
           
            <label>وصف المهمة:</label>
            <textarea id="description" rows="3" placeholder="اكتب وصف المهمة (اختياري)"></textarea>

            <label>تاريخ التسليم:</label>
            <input type="date" id="date" required>

            <label>الأولوية:</label>
            <select id="priority" required>
                <option value="">اختر الأولوية</option>
                <option value="عالية">عالية</option>
                <option value="متوسطة">متوسطة</option>
                <option value="منخفضة">منخفضة</option>
            </select>

            <input type="submit" class="btn1" value=" حفظ المهمة">
        </form>

    </main>
        <script src="main copy.js"></script>
    <footer>
        <p>© 2026 نظام إدارة المهام</p>
    </footer>

</body>
</html>
