<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل مهمة | نظام المهام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> نظام إدارة المهام</h1>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="add-task.html">إضافة مهمة</a>
            <a href="tasks.html">المهام</a>
            <a href="edit-task.html">تعديل</a>
            <a href="statistics.html">إحصائيات</a>
        </nav>
    </header>

    <main>
        <h2 class="add_addrass"> تعديل المهمة</h2>
        
        <form id="editForm" class="form-box">
            <input type="hidden" id="taskId">

            <label>عنوان المهمة</label>
            <input type="text" id="title" required>

            <label>وصف المهمة</label>
            <textarea id="description" rows="3"></textarea>

            <label>تاريخ التسليم</label>
            <input type="date" id="date" required>

            <label>الأولوية</label>
            <select id="priority" required>
                <option value="عالية">عالية</option>
                <option value="متوسطة">متوسطة</option>
                <option value="منخفضة">منخفضة</option>
            </select>

            <label>الحالة</label>
            <select id="status">
                <option value="قيد الانتظار">قيد الانتظار</option>
                <option value="مكتملة">مكتملة</option>
            </select>

            <button type="submit" class="btn1"> حفظ التعديلات</button>
        </form>

        <p id="message" class="message"></p>
    </main>
           <script src="main copy.js"></script>

    <footer>
        <p>© 2024 نظام إدارة المهام</p>
    </footer>

</body>
</html>
